<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>朝の予定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: rgba(255,255,255,0.07);
    --text: #e8e6f0;
    --muted: #5a5870;
    --accent-wake: #c084fc;
    --accent-bath: #38bdf8;
    --accent-warn: #fb923c;
    --green: #4ade80;
    --tag-meal: #86efac;
    --tag-bento: #6ee7b7;
    --tag-dress: #a5b4fc;
    --tag-hair: #7dd3fc;
    --tag-bag: #fcd34d;
    --tag-buffer: #475569;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
    overflow-x: hidden;
  }

  /* Noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  .container {
    position: relative;
    z-index: 1;
    padding: 20px 20px 32px;
    flex: 1;
    max-width: 430px;
    margin: 0 auto;
    width: 100%;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 28px;
  }

  .header-left {}

  .date-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .day-display {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .clock {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    text-align: right;
    line-height: 1.5;
  }

  .clock .time-now {
    font-size: 18px;
    color: var(--text);
    font-weight: 500;
  }

  /* Wake card */
  .wake-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px 24px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .wake-card::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 120px; height: 120px;
    border-radius: 50%;
    opacity: 0.06;
  }

  .wake-card.no-bath::before { background: var(--accent-wake); }
  .wake-card.with-bath::before { background: var(--accent-bath); }

  .wake-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    font-family: 'DM Mono', monospace;
  }

  .wake-time {
    font-family: 'DM Mono', monospace;
    font-size: 52px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: -0.03em;
  }

  .wake-card.no-bath .wake-time { color: var(--accent-wake); }
  .wake-card.with-bath .wake-time { color: var(--accent-bath); }

  .wake-time.rule830 {
    color: var(--green) !important;
  }

  .wake-sublabel {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    font-weight: 300;
  }

  .cards-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }

  /* Info card */
  .info-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
  }

  .info-card .label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    font-family: 'DM Mono', monospace;
  }

  .info-card .value {
    font-family: 'DM Mono', monospace;
    font-size: 24px;
    font-weight: 500;
    color: var(--text);
  }

  .info-card .sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    font-weight: 300;
  }

  .info-card.depart .value { color: var(--accent-warn); }

  /* Bath toggle */
  .bath-toggle {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.2s;
  }

  .bath-toggle:active { opacity: 0.8; }

  .bath-toggle.active { border-color: rgba(56,189,248,0.4); }

  .toggle-icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    background: rgba(255,255,255,0.04);
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .bath-toggle.active .toggle-icon { background: rgba(56,189,248,0.12); }

  .toggle-text {}
  .toggle-title {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 2px;
  }
  .toggle-sub {
    font-size: 11px;
    color: var(--muted);
    font-weight: 300;
  }

  .toggle-switch {
    margin-left: auto;
    width: 44px; height: 26px;
    background: var(--border);
    border-radius: 13px;
    position: relative;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .bath-toggle.active .toggle-switch { background: var(--accent-bath); }

  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 20px; height: 20px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }

  .bath-toggle.active .toggle-switch::after { transform: translateX(18px); }

  /* Tasks */
  .tasks-section {
    margin-bottom: 8px;
  }

  .tasks-header {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    font-family: 'DM Mono', monospace;
  }

  .task-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .task-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--surface);
    border-radius: 12px;
    border: 1px solid var(--border);
  }

  .task-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .task-name {
    font-size: 13px;
    font-weight: 400;
    flex: 1;
  }

  .task-time {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  /* Timeline bar */
  .timeline {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .timeline-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    font-family: 'DM Mono', monospace;
  }

  .bar-track {
    height: 10px;
    background: rgba(255,255,255,0.05);
    border-radius: 6px;
    display: flex;
    overflow: hidden;
    gap: 1px;
  }

  .bar-seg {
    height: 100%;
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .bar-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    margin-top: 10px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--muted);
  }

  .legend-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
  }

  /* Day nav */
  .day-nav {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .day-btn {
    flex: 1;
    padding: 8px 4px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--muted);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }

  .day-btn.active {
    border-color: var(--accent-wake);
    color: var(--accent-wake);
    background: rgba(192,132,252,0.06);
  }

  .day-btn.today-mark {
    position: relative;
  }

  .day-btn.today-mark::after {
    content: '';
    position: absolute;
    bottom: 4px; left: 50%;
    transform: translateX(-50%);
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--accent-warn);
  }

  /* Notice */
  .notice {
    background: rgba(251,146,60,0.08);
    border: 1px solid rgba(251,146,60,0.2);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 12px;
    color: #fdba74;
    line-height: 1.6;
    margin-bottom: 16px;
    display: none;
  }

  .notice.show { display: block; }

  /* Holiday */
  .holiday-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 24px;
    text-align: center;
  }

  .holiday-icon { font-size: 40px; margin-bottom: 12px; }
  .holiday-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .holiday-sub { font-size: 13px; color: var(--muted); font-weight: 300; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .animate-in { animation: fadeIn 0.35s ease forwards; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <div class="date-label" id="dateLabel"></div>
      <div class="day-display" id="dayDisplay"></div>
    </div>
    <div class="clock">
      <div class="time-now" id="clockEl"></div>
      <div id="nextChangeLabel" style="font-size:10px;margin-top:2px;"></div>
    </div>
  </div>

  <!-- Day nav -->
  <div class="day-nav" id="dayNav"></div>

  <!-- Main content -->
  <div id="mainContent"></div>
</div>

<script>
// スケジュールデータ
// wakeNoBath: 風呂なし起床時間 (分で表現, 0=0:00)
// wakeBath:   風呂あり起床時間
// depart:     出発時刻
// class:      授業/バス
// note:       注意メモ
// rule830:    8:30ルール適用かどうか

const DAYS = ['日','月','火','水','木','金','土'];

const schedule = {
  1: { // 月
    wakeNoBath: 8*60+30, wakeBath: 8*60+30,
    depart: 12*60+44, event: '13:00 授業',
    rule830Both: true,
    note: '余裕たっぷり。朝の時間を有効活用しよう。'
  },
  2: { // 火
    wakeNoBath: 7*60+39, wakeBath: 7*60+24,
    depart: 8*60+34, event: '8:50 授業',
    rule830Both: false,
    note: '月曜に入浴済みなら風呂なしで7:39起き。'
  },
  3: { // 水
    wakeNoBath: 8*60+30, wakeBath: 8*60+30,
    depart: 10*60+14, event: '10:30 授業',
    rule830Both: true,
    note: null
  },
  4: { // 木
    holiday: true,
    note: '金曜に備えて今夜はお風呂に入ろう。'
  },
  5: { // 金
    wakeNoBath: 6*60+50, wakeBath: 6*60+35,
    depart: 7*60+45, event: '7:45 バス',
    rule830Both: false,
    isBus: true,
    note: '木曜に入浴済みなら風呂なしで6:50起き。バスは乗り遅れ厳禁！'
  }
};

// タスク定義
function getTasks(hasBath) {
  const base = [
    { name: '朝ごはん', min: 10, color: '#4ade80' },
    { name: 'お弁当の準備', min: 15, color: '#6ee7b7' },
    { name: '服を選ぶ・着る', min: 5, color: '#a5b4fc' },
  ];
  if (hasBath) {
    base.push({ name: 'お風呂', min: 15, color: '#38bdf8' });
    base.push({ name: '髪を乾かす・セット', min: 10, color: '#7dd3fc' });
  } else {
    base.push({ name: '身だしなみ・髪セット', min: 10, color: '#7dd3fc' });
  }
  base.push({ name: '荷物をまとめる', min: 5, color: '#fcd34d' });
  base.push({ name: '余裕', min: 10, color: '#334155' });
  return base;
}

function fmtMin(m) {
  const h = Math.floor(m / 60);
  const min = m % 60;
  return `${h}:${String(min).padStart(2,'0')}`;
}

// 今日か次の平日の表示日を決定
function getDisplayDay() {
  const now = new Date();
  const dow = now.getDay(); // 0=日
  const hour = now.getHours();

  // 今日が平日 && 12:00前 → 今日
  // 今日が平日 && 12:00以降 → 翌平日
  // 今日が土日 → 次の月曜

  let target = dow;

  const isWeekday = (d) => d >= 1 && d <= 5;

  if (isWeekday(target)) {
    if (hour >= 12) {
      // 翌平日
      target = target === 5 ? 1 : target + 1;
      // 木曜は休みなので金曜へ（月→火は普通）
      if (target === 4) target = 5;
    }
  } else {
    // 土→月, 日→月
    target = 1;
  }

  return target;
}

// 今日の曜日インデックス
function getTodayDow() {
  return new Date().getDay();
}

let selectedDay = getDisplayDay();
let bathOn = false;

function render() {
  renderDayNav();
  renderMain();
  updateClock();
}

function renderDayNav() {
  const nav = document.getElementById('dayNav');
  const today = getTodayDow();
  nav.innerHTML = '';
  [1,2,3,4,5].forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (d === selectedDay ? ' active' : '') + (d === today ? ' today-mark' : '');
    btn.textContent = DAYS[d];
    btn.onclick = () => { selectedDay = d; render(); };
    nav.appendChild(btn);
  });
}

function renderMain() {
  const content = document.getElementById('mainContent');
  const data = schedule[selectedDay];
  const dayName = DAYS[selectedDay];

  // date header
  const now = new Date();
  const displayIsToday = selectedDay === getTodayDow() && now.getHours() < 12;
  const displayIsTomorrow = selectedDay === getDisplayDay() && !displayIsToday;

  let dayLabel = `${now.getFullYear()}年${now.getMonth()+1}月`;
  document.getElementById('dateLabel').textContent = dayLabel + (displayIsToday ? ' — 今日' : displayIsTomorrow ? ' — 次の登校日' : '');
  document.getElementById('dayDisplay').textContent = `${dayName}曜日`;

  if (data.holiday) {
    content.innerHTML = `
      <div class="holiday-card animate-in">
        <div class="holiday-icon">☕</div>
        <div class="holiday-title">木曜は休み</div>
        <div class="holiday-sub">${data.note || ''}</div>
      </div>
    `;
    return;
  }

  const tasks = getTasks(bathOn);
  const totalMin = tasks.reduce((s,t) => s + t.min, 0);
  const wake = bathOn ? data.wakeBath : data.wakeNoBath;
  const wakeStr = fmtMin(wake);
  const isRule830 = wake <= 8*60+30 && data.rule830Both;

  const noticeHtml = (data.note && data.isBus)
    ? `<div class="notice show">⚠️ ${data.note}</div>`
    : (data.note ? `<div class="notice show" style="background:rgba(192,132,252,0.07);border-color:rgba(192,132,252,0.2);color:#d8b4fe;">💡 ${data.note}</div>` : '');

  // bar segments
  const barTotal = totalMin;
  const segs = tasks.map(t => {
    const pct = (t.min / barTotal * 100).toFixed(1);
    return `<div class="bar-seg" style="width:${pct}%;background:${t.color};opacity:${t.color === '#334155' ? 0.5 : 0.85}"></div>`;
  }).join('');

  const legendItems = tasks.map(t =>
    `<div class="legend-item"><div class="legend-dot" style="background:${t.color}"></div>${t.name}</div>`
  ).join('');

  const taskRows = tasks.map(t =>
    `<div class="task-row">
      <div class="task-dot" style="background:${t.color}"></div>
      <div class="task-name">${t.name}</div>
      <div class="task-time">${t.min}分</div>
    </div>`
  ).join('');

  content.innerHTML = `
    ${noticeHtml}

    <div class="cards-row animate-in">
      <div class="wake-card ${bathOn ? 'with-bath' : 'no-bath'}">
        <div class="wake-label">起床時間</div>
        <div class="wake-time ${isRule830 ? 'rule830' : ''}">${wakeStr}</div>
        <div class="wake-sublabel">${isRule830 ? '8:30ルール適用' : (bathOn ? '風呂あり' : '風呂なし')}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div class="info-card depart">
          <div class="label">出発</div>
          <div class="value">${fmtMin(data.depart)}</div>
          <div class="sub">${data.event}</div>
        </div>
        <div class="info-card">
          <div class="label">準備時間</div>
          <div class="value">${totalMin}<span style="font-size:13px;color:var(--muted);font-family:'Noto Sans JP'">分</span></div>
        </div>
      </div>
    </div>

    <div class="bath-toggle ${bathOn ? 'active' : ''} animate-in" id="bathToggle" onclick="toggleBath()">
      <div class="toggle-icon">🚿</div>
      <div class="toggle-text">
        <div class="toggle-title">朝風呂する</div>
        <div class="toggle-sub">+25分 (風呂15分+髪10分)</div>
      </div>
      <div class="toggle-switch"></div>
    </div>

    <div class="timeline animate-in">
      <div class="timeline-label">タスク内訳 — 計${totalMin}分</div>
      <div class="bar-track">${segs}</div>
      <div class="bar-legend">${legendItems}</div>
    </div>

    <div class="tasks-section animate-in">
      <div class="tasks-header">タスクリスト</div>
      <div class="task-list">${taskRows}</div>
    </div>
  `;
}

function toggleBath() {
  bathOn = !bathOn;
  renderMain();
}

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clockEl').textContent = `${h}:${m}:${s}`;

  // 次の切り替えまでの時間
  const isAM = now.getHours() < 12;
  const label = document.getElementById('nextChangeLabel');
  if (isAM) {
    const minsLeft = (12*60) - (now.getHours()*60 + now.getMinutes());
    if (minsLeft < 60) {
      label.textContent = `${minsLeft}分後に翌日表示へ`;
      label.style.color = 'var(--accent-warn)';
    } else {
      label.textContent = '';
    }
  } else {
    label.textContent = '翌日モード';
    label.style.color = 'var(--muted)';
  }
}

// 初期化
render();
setInterval(() => {
  updateClock();
  // 毎分チェック: 12:00になったらリフレッシュ
  const now = new Date();
  if (now.getHours() === 12 && now.getMinutes() === 0 && now.getSeconds() === 0) {
    selectedDay = getDisplayDay();
    render();
  }
}, 1000);
</script>
</body>
</html>
